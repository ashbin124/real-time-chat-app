<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
        }

        .chat-container {
            display: flex;
            height: 100vh;
            max-width: 1200px;
            margin: auto;
            background: white;
        }

        .sidebar {
            width: 300px;
            border-right: 1px solid #ddd;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
        }

        .user {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .user:hover {
            background: #f0f0f0;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        #chat-status {
            font-size: 13px;
            font-weight: normal;
            margin-top: 5px;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 60%;
            background: #eee;
        }

        .message.mine {
            align-self: flex-end;
            background: #007aff;
            color: white;
            margin-left: auto;
        }

        .message.theirs {
            align-self: flex-start;
            background: #e5e5ea;
            color: black;
            margin-right: auto;
        }

        .message small {
            display: block;
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.7;
        }

        .message-form {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        .message-form input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .message-form button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007aff;
            color: white;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <aside class="sidebar">

        <h2>Users</h2>

        <div id="users">
            <!-- Users will appear here -->
        </div>

    </aside>


    <main class="chat">

        <header class="chat-header">

            <span id="chat-title">
                Select a user
            </span>

            <div id="chat-status"></div>

        </header>


        <section class="messages" id="messages">
            <!-- Messages will appear here -->
        </section>


        <form class="message-form" id="message-form">

            <input
                type="text"
                id="message-input"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button type="submit">
                Send
            </button>

        </form>

    </main>

</div>


<script>

const usersContainer =
    document.getElementById("users");

const messagesContainer =
    document.getElementById("messages");

const chatTitle =
    document.getElementById("chat-title");

const chatStatus =
    document.getElementById("chat-status");


let currentConversationId = null;

let chatSocket = null;


const currentUser =
    JSON.parse(
        localStorage.getItem("user")
    );


const currentUserId =
    currentUser
        ? currentUser.id
        : null;


// ===============================
// LOAD USERS
// ===============================

async function loadUsers() {

    const token =
        localStorage.getItem("token");


    const response =
        await fetch(
            "/api/users/",
            {
                headers: {
                    "Authorization":
                        `Token ${token}`
                }
            }
        );


    const users =
        await response.json();


    usersContainer.innerHTML = "";


    users.forEach(user => {

        const userElement =
            document.createElement("div");


        userElement.classList.add(
            "user"
        );


        userElement.textContent =
            user.username;


        userElement.addEventListener(
            "click",
            () => {

                console.log(
                    "User clicked:",
                    user
                );


                loadMessages(user);

            }
        );


        usersContainer.appendChild(
            userElement
        );

    });

}


// ===============================
// LOAD MESSAGES
// ===============================

async function loadMessages(user) {

    chatTitle.textContent =
        user.username;


    chatStatus.textContent =
        "⚫ Offline";


    const token =
        localStorage.getItem("token");


    // Find or create conversation
    const conversationResponse =
        await fetch(
            `/api/conversations/with/${user.id}/`,
            {
                headers: {
                    "Authorization":
                        `Token ${token}`
                }
            }
        );


    if (!conversationResponse.ok) {

        const error =
            await conversationResponse.json();


        console.error(
            "Conversation failed:",
            error
        );


        return;

    }


    const conversation =
        await conversationResponse.json();


    currentConversationId =
        conversation.id;


    console.log(
        "Current conversation:",
        currentConversationId
    );


    // Connect WebSocket
    connectWebSocket();


    // Load existing messages
    const response =
        await fetch(
            `/api/conversations/${currentConversationId}/messages/`,
            {
                headers: {
                    "Authorization":
                        `Token ${token}`
                }
            }
        );


    const messages =
        await response.json();


    if (!response.ok) {

        console.error(
            "Messages failed:",
            messages
        );


        return;

    }


    messagesContainer.innerHTML = "";


    messages.forEach(message => {

        const messageElement =
            document.createElement("div");


        messageElement.classList.add(
            "message"
        );


        // Current user = right
        if (
            message.sender.id ===
            currentUserId
        ) {

            messageElement.classList.add(
                "mine"
            );

        }

        // Other user = left
        else {

            messageElement.classList.add(
                "theirs"
            );

        }


        // Timestamp
        const time =
            new Date(
                message.created_at
            ).toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        messageElement.innerHTML = `
            <div>${message.content}</div>
            <small>${time}</small>
        `;


        messagesContainer.appendChild(
            messageElement
        );

    });


    messagesContainer.scrollTop =
        messagesContainer.scrollHeight;

}


// ===============================
// WEBSOCKET CONNECTION
// ===============================

function connectWebSocket() {

    if (!currentConversationId) {

        return;

    }


    // Close previous connection
    if (chatSocket) {

        chatSocket.close();

    }


    const wsProtocol =
        window.location.protocol === "https:"
            ? "wss"
            : "ws";


    const token =
        localStorage.getItem("token");


    chatSocket =
        new WebSocket(
            `${wsProtocol}://${window.location.host}/ws/chat/${currentConversationId}/?token=${encodeURIComponent(token)}`
        );


    // Connected
    chatSocket.onopen =
        function() {

            console.log(
                "WebSocket connected:",
                currentConversationId
            );

        };


    // Message received
    chatSocket.onmessage =
        function(event) {

            const data =
                JSON.parse(event.data);


            // ===============================
            // ONLINE / OFFLINE STATUS
            // ===============================

            if (
                data.type === "status"
            ) {

                if (
                    data.user_id !==
                    currentUserId
                ) {

                    if (
                        data.status ===
                        "online"
                    ) {

                        chatStatus.textContent =
                            "🟢 Online";

                    }

                    else {

                        chatStatus.textContent =
                            "⚫ Offline";

                    }

                }


                return;

            }


            // ===============================
            // NEW CHAT MESSAGE
            // ===============================

            const messageElement =
                document.createElement("div");


            messageElement.classList.add(
                "message"
            );


            // Current user = right
            if (
                data.sender_id ===
                currentUserId
            ) {

                messageElement.classList.add(
                    "mine"
                );

            }

            // Other user = left
            else {

                messageElement.classList.add(
                    "theirs"
                );

            }


            // Timestamp
            const time =
                new Date(
                    data.timestamp
                ).toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            messageElement.innerHTML = `
                <div>${data.message}</div>
                <small>${time}</small>
            `;


            messagesContainer.appendChild(
                messageElement
            );


            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        };


    // Connection closed
    chatSocket.onclose =
        function() {

            console.log(
                "WebSocket disconnected"
            );


            chatStatus.textContent =
                "⚫ Offline";

        };


    // WebSocket error
    chatSocket.onerror =
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );

        };

}


// ===============================
// SEND MESSAGE
// ===============================

const messageForm =
    document.getElementById(
        "message-form"
    );


const messageInput =
    document.getElementById(
        "message-input"
    );


messageForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const content =
            messageInput.value.trim();


        if (!content) {

            return;

        }


        if (!currentConversationId) {

            console.log(
                "Please select a user first."
            );


            return;

        }


        // Send through WebSocket
        if (
            chatSocket &&
            chatSocket.readyState ===
            WebSocket.OPEN
        ) {

            chatSocket.send(
                JSON.stringify({
                    message: content
                })
            );


            messageInput.value = "";

        }

        else {

            console.error(
                "WebSocket is not connected."
            );

        }

    }
);


// ===============================
// START APP
// ===============================

loadUsers();

</script>

</body>
</html>
