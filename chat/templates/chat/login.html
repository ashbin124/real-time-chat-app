<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Chat App</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }

        .login-box {
            width: 320px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #007aff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0066d6;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>Login</h1>

        <form id="login-form">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="error"></div>

    </div>


    <script>

        const loginForm =
            document.getElementById("login-form");

        const errorElement =
            document.getElementById("error");


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;


                const response = await fetch(
                    "/api/login/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    errorElement.textContent =
                        data.error || "Login failed.";

                    return;
                }


                // Save authentication token
                localStorage.setItem(
                    "token",
                    data.token
                );


                // Save logged-in user
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );


                // Go to chat
                window.location.href = "/chat/";

            }
        );

    </script>

</body>

</html>
